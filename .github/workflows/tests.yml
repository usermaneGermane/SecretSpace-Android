name: tests

# The Kotlin core against the PC client's CURRENT code: the test data is
# made again from SecretSpace-Client-Windows main on every run, and what the
# Kotlin port makes is opened by the PC's code. A format change on the PC
# that the phone does not follow fails here. The sign-in tests run against
# the PC tests' copy of the server, over HTTPS, with accounts the PC's code
# made; afterwards the PC's code opens the account folder the phone wrote.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: usermaneGermane/SecretSpace-Client-Windows
          path: pc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Downloads kept between runs: fewer requests to Maven Central, which
      # answers a burst of them with 429 Too Many Requests.
      - uses: gradle/actions/setup-gradle@v4
      - name: Test data from the PC's code
        run: |
          python -m pip install -r pc/requirements.txt
          python tools/make_vectors.py pc/sourceFiles
          python tools/make_merge_vectors.py pc/sourceFiles
      - name: Kotlin core, signing in to a real server the PC filled
        env:
          SECRETSPACE_LAB_REQUIRED: "1"
        run: python tools/lab_server.py pc/sourceFiles -- ./gradlew --no-daemon :core:test
      - name: The PC opens what Kotlin made
        run: python tools/check_on_pc.py pc/sourceFiles
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: core/build/reports/tests

  app:
    # The Android app builds, and its own tests pass. (Signed releases are
    # built where the key is, never here.)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: App tests and a debug build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
